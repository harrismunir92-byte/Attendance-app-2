name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Prepare web folder
        run: mkdir -p www; if [ -f index.html ]; then mv index.html www/index.html; fi; test -f www/index.html
      - name: Bundle Excel library
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js && cp node_modules/jspdf/dist/jspdf.umd.min.js www/jspdf.umd.min.js
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
